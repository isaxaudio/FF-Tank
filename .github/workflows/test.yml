# Fast, credential-free tier: lint the UI and run the API access/reliability regressions on every push and PR.
# Heavier checks (headless preview, mailbox round trips) stay in scripts/verify-step*.mjs and need an approved environment.
name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
